name: NetShield CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Linting, Static Analysis & Automated Testing
  # ============================================================================
  backend-test:
    name: Backend Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov flake8

      - name: Python Static Analysis & Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app ml/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app ml/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Pytest Suite (50 Tests with Coverage)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests/ tests/ -v --cov=backend/app --cov-report=xml --cov-report=term

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ============================================================================
  # 2. Frontend Contract Tests, Typecheck & Production Build
  # ============================================================================
  frontend-test:
    name: Frontend Tests & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Static Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: Execute Frontend Contract & Edge Case Tests (20 Tests)
        working-directory: frontend
        run: npm test

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: frontend-dist-bundle
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # 3. Docker Container Build & Live Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: Docker Container Build & Integration Smoke Test
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          tags: |
            netshield-backend:ci
            netshield-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          tags: |
            netshield-frontend:ci
            netshield-frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Spin Up Multi-Container Stack (Docker Compose)
        run: |
          docker compose up -d

      - name: Verify Backend Container Healthcheck Probe
        run: |
          echo "Waiting for backend container health..."
          for i in {1..20}; do
            STATUS=$(curl -s http://localhost:8000/api/v1/health | grep -o '"status":"healthy"' || true)
            if [ -n "$STATUS" ]; then
              echo "Backend is healthy: $STATUS"
              break
            fi
            echo "Attempt $i: waiting 3 seconds..."
            sleep 3
          done
          curl -f http://localhost:8000/api/v1/health

      - name: Verify Live Single-Flow Prediction in Container
        run: |
          PRED=$(curl -s -X POST "http://localhost:8000/api/v1/predict" \
            -H "Content-Type: application/json" \
            -d '{
              "dur": 0.000011, "proto": "udp", "service": "-", "state": "INT",
              "spkts": 2, "dpkts": 0, "sbytes": 496, "dbytes": 0, "rate": 90909.0902,
              "sttl": 254, "dttl": 0, "sload": 180363632.0, "dload": 0.0, "sloss": 0,
              "dloss": 0, "sinpkt": 0.011, "dinpkt": 0.0, "sjit": 0.0, "djit": 0.0,
              "swin": 0, "stcpb": 0, "dtcpb": 0, "dwin": 0, "tcprtt": 0.0, "synack": 0.0,
              "ackdat": 0.0, "smean": 248, "dmean": 0, "trans_depth": 0,
              "response_body_len": 0, "ct_srv_src": 2, "ct_state_ttl": 2,
              "ct_dst_ltm": 1, "ct_src_dport_ltm": 1, "ct_dst_sport_ltm": 1,
              "ct_dst_src_ltm": 2, "is_ftp_login": 0, "ct_ftp_cmd": 0,
              "ct_flw_http_mthd": 0, "ct_src_ltm": 1, "ct_srv_dst": 2,
              "is_sm_ips_ports": 0
            }')
          echo "Prediction Output: $PRED"
          echo "$PRED" | grep -q '"prediction":' || (echo "Failed prediction assertion" && exit 1)

      - name: Verify Frontend Container Response & Proxy
        run: |
          curl -f http://localhost:3001/healthz
          curl -s http://localhost:3001/ | grep -q "NETSHIELD" || (echo "Frontend index did not load" && exit 1)

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down -v

  # ============================================================================
  # 4. Optional Publish to GitHub Container Registry (Main Branch / Tags)
  # ============================================================================
  publish-ghcr:
    name: Publish Container Images to GHCR
    needs: [docker-smoke-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU (Multi-Arch Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Multi-Arch Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Multi-Arch Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
